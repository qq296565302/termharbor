# 发版工作流：打 tag 出 Windows 安装包并发布到 Releases。
# 只做 NSIS 安装包（其它平台还没做，见开发计划 R-1）。
name: Release

# 只在打 tag 时出包并发布；手动触发时只构建、传 artifact，不碰 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 建 Release 需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发版流程别互相打断

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows · NSIS 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号三处必须一致，而且 tag 必须等于这个版本。
      # 否则会出现"打 tag v0.1.16 却发出 0.1.15 的包"这种事，事后很难查。
      - name: 版本号一致性检查
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          "tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$cargo"
          if ($pkg -ne $conf -or $cargo -ne $conf) {
            throw "三处版本号不一致，先同步再打 tag"
          }
          if ($env:REF_TYPE -eq "tag") {
            $tagVersion = $env:REF_NAME.TrimStart("v")
            if ($tagVersion -ne $conf) {
              throw "tag '$($env:REF_NAME)' 与版本号 $conf 不一致"
            }
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 走 package.json 里的封装：它在 PATH 齐全时等于是直通，顺带绕开 tauri.cmd 的参数拼接
      - name: 构建安装包
        run: pnpm tauri build --bundles nsis

      - name: 上传 artifact（手动触发时也能拿到包）
        uses: actions/upload-artifact@v4
        with:
          name: termharbor-windows-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 发布 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          draft: false

      # 说明：这里**不做** updater 产物（.sig / latest.json）。
      # 没有代码签名时，全自动更新会在 SmartScreen 那一步失败，做了也没人能用。
      # 等 R-2 签名落地后再加 createUpdaterArtifacts + minisign 那套，见开发计划 R-3。
